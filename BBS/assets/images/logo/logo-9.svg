<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="386" height="72" viewBox="0 0 386 72">
  <defs>
    <style>
      .cls-1 {
        filter: url(#filter);
      }
    </style>
    <filter id="filter" filterUnits="userSpaceOnUse">
      <feFlood result="flood" flood-color="#fff"/>
      <feComposite result="composite" operator="in" in2="SourceGraphic"/>
      <feBlend result="blend" in2="SourceGraphic"/>
    </filter>
  </defs>
  <g class="cls-1">
    <image x="6" y="8" width="58" height="57" xlink:href="data:img/png;base64,"/>
    <image x="75" y="8" width="305" height="57" xlink:href="data:img/png;base64,"/>
  </g>
</svg>
